title: "Idea: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a feature or improvement. For a concrete bug, use **Bug report** instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should tick do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Hooks, CLI, plugins, or browser Jira?
